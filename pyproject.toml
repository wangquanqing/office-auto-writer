[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "office-auto-writer"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "wangquanqing", email = "wangquanqing1636@sina.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["lunar-python>=1.4.8,<2", "cnlunar>=0.2.4,<0.3"]

[project.urls]
Documentation = "https://github.com/wangquanqing/office-auto-writer#readme"
Issues = "https://github.com/wangquanqing/office-auto-writer/issues"
Source = "https://github.com/wangquanqing/office-auto-writer"

[tool.hatch.version]
path = "src/office_auto_writer/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/office_auto_writer tests}"

[tool.coverage.run]
source_pkgs = ["office_auto_writer", "tests"]
branch = true
parallel = true
omit = [
  "src/office_auto_writer/__about__.py",
]

[tool.coverage.paths]
office_auto_writer = ["src/office_auto_writer", "*/office-auto-writer/src/office_auto_writer"]
tests = ["tests", "*/office-auto-writer/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
office-auto-writer = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.14.4,<3.15"
pandas = ">=3.0.2,<4"
xlsxwriter = ">=3.2.9,<4"
openpyxl = ">=3.1.5,<4"
python-docx = ">=1.2.0,<2"
